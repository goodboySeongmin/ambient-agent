<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <title>Ambient Agent</title>

  <style>
    body {
      width: 280px;
      padding: 18px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 12px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: green;
    }

    .description {
      font-size: 13px;
      line-height: 1.5;
      opacity: 0.75;
    }
  </style>
</head>

<body>

  <h2>Ambient Agent</h2>

  <div class="status">
    <div class="dot"></div>
    <strong>Observing</strong>
  </div>

  <div class="description">
    Browser activity is being observed
    for context understanding.
  </div>

</body>
</html>
